<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}twitter_jobs{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#00629d",
            "on-primary": "#ffffff",
            "primary-container": "#1d9bf0",
            "primary-fixed": "#cfe5ff",
            "primary-fixed-dim": "#99cbff",
            "on-primary-container": "#003050",
            secondary: "#006c49",
            "on-secondary": "#ffffff",
            "secondary-container": "#6cf8bb",
            "secondary-fixed": "#6ffbbe",
            "secondary-fixed-dim": "#4edea3",
            "on-secondary-container": "#00714d",
            tertiary: "#be0037",
            "tertiary-container": "#ff5c6f",
            "tertiary-fixed": "#ffdada",
            "tertiary-fixed-dim": "#ffb3b6",
            "on-tertiary-container": "#630018",
            error: "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a",
            background: "#f8f9ff",
            surface: "#f8f9ff",
            "on-background": "#0b1c30",
            "on-surface": "#0b1c30",
            "on-surface-variant": "#3f4851",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#eff4ff",
            "surface-container": "#e5eeff",
            "surface-container-high": "#dce9ff",
            "surface-container-highest": "#d3e4fe",
            "surface-variant": "#d3e4fe",
            outline: "#6f7883",
            "outline-variant": "#bfc7d3"
          },
          borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
          spacing: {
            xs: "4px", sm: "8px", base: "8px", md: "16px", lg: "24px", xl: "40px",
            gutter: "20px", "container-max": "1280px"
          },
          fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] },
          fontSize: {
            "label-sm": ["12px", { lineHeight: "1", letterSpacing: "0.02em", fontWeight: "500" }],
            "label-md": ["14px", { lineHeight: "1", fontWeight: "600" }],
            "body-md": ["14px", { lineHeight: "1.5", fontWeight: "400" }],
            "body-lg": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
            h3: ["20px", { lineHeight: "1.4", letterSpacing: "-0.01em", fontWeight: "600" }],
            h2: ["24px", { lineHeight: "1.3", letterSpacing: "-0.01em", fontWeight: "600" }],
            h1: ["32px", { lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "700" }]
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: "Inter", system-ui, sans-serif; }
    .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
    .icon-fill { font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24; }
  </style>
</head>
<body class="bg-background text-on-background antialiased min-h-screen">
  <nav class="fixed top-0 inset-x-0 z-50 flex items-center justify-between px-8 h-16 bg-surface-container-lowest border-b border-outline-variant/60 shadow-sm">
    <div class="flex items-center gap-lg">
      <a href="/" class="text-xl font-black text-primary-container">twitter_jobs</a>
    </div>
    <div class="hidden md:flex items-end h-full gap-lg text-sm font-medium">
      <a href="/" class="pb-4 h-full flex items-end transition-colors {% if page == 'dashboard' %}text-primary border-b-2 border-primary{% else %}text-on-surface-variant hover:text-primary{% endif %}">Dashboard</a>
      <a href="/review" class="pb-4 h-full flex items-end transition-colors {% if page == 'review' %}text-primary border-b-2 border-primary{% else %}text-on-surface-variant hover:text-primary{% endif %}">Review</a>
      <a href="/all" class="pb-4 h-full flex items-end transition-colors {% if page == 'all' %}text-primary border-b-2 border-primary{% else %}text-on-surface-variant hover:text-primary{% endif %}">All History</a>
      <a href="/training" class="pb-4 h-full flex items-end transition-colors {% if page == 'training' %}text-primary border-b-2 border-primary{% else %}text-on-surface-variant hover:text-primary{% endif %}">Training</a>
      <a href="/health" class="pb-4 h-full flex items-end transition-colors text-on-surface-variant hover:text-primary">Health</a>
    </div>
    <div></div>
  </nav>
  <main class="pt-[80px] px-xl pb-xl max-w-container-max mx-auto min-h-screen flex flex-col gap-lg">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
