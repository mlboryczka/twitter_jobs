# Alembic configuration for twitter_jobs.
# The DB URL is supplied programmatically in src/twitter_jobs/alembic/env.py
# from the Settings object; sqlalchemy.url here is intentionally blank.

[alembic]
script_location = src/twitter_jobs/alembic
prepend_sys_path = .
version_path_separator = os
path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
